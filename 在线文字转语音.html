<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线文字转语音工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .text-input {
            width: 100%;
            height: 200px;
            padding: 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            resize: none;
            outline: none;
            background-color: white;
            transition: border-color 0.3s ease;
        }

        .text-input:focus {
            border-color: #4a90d9;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-start {
            background-color: #4a90d9;
            color: white;
        }

        .btn-start:hover {
            background-color: #3d7bc6;
            transform: translateY(-2px);
        }

        .btn-pause {
            background-color: #f0ad4e;
            color: white;
        }

        .btn-pause:hover {
            background-color: #ec971f;
            transform: translateY(-2px);
        }

        .btn-resume {
            background-color: #5cb85c;
            color: white;
        }

        .btn-resume:hover {
            background-color: #4cae4c;
            transform: translateY(-2px);
        }

        .speed-control {
            margin-top: 25px;
        }

        .speed-label {
            display: block;
            color: #666;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .speed-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: #ddd;
            border-radius: 4px;
            outline: none;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: #4a90d9;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .speed-slider::-webkit-slider-thumb:hover {
            background-color: #3d7bc6;
        }

        .speed-value {
            display: inline-block;
            margin-left: 15px;
            color: #4a90d9;
            font-weight: bold;
            min-width: 50px;
        }

        .ad-banner {
            background-color: #e8e8e8;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            border-top: 1px solid #ddd;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .text-input {
                height: 150px;
            }
            
            button {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 在线文字转语音</h1>
        
        <textarea class="text-input" id="textInput" placeholder="请输入要朗读的文字..."></textarea>
        
        <div class="controls">
            <button class="btn-start" id="startBtn">开始朗读</button>
            <button class="btn-pause" id="pauseBtn" disabled>暂停</button>
        </div>
        
        <div class="speed-control">
            <label class="speed-label">语速调节</label>
            <input type="range" class="speed-slider" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
            <span class="speed-value" id="speedValue">1.0x</span>
        </div>
    </div>
    
    <div class="ad-banner">
        广告位
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');

        let speechSynthesis = window.speechSynthesis;
        let currentUtterance = null;
        let isPaused = false;

        // 更新语速显示
        speedSlider.addEventListener('input', () => {
            speedValue.textContent = `${speedSlider.value}x`;
        });

        // 开始朗读
        startBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            
            if (!text) {
                alert('请输入要朗读的文字');
                return;
            }

            // 停止之前的语音
            speechSynthesis.cancel();

            // 创建新的语音合成对象
            currentUtterance = new SpeechSynthesisUtterance(text);
            
            // 设置语言为中文
            currentUtterance.lang = 'zh-CN';
            
            // 设置语速
            currentUtterance.rate = parseFloat(speedSlider.value);
            
            // 设置音量
            currentUtterance.volume = 1;
            
            // 设置音调
            currentUtterance.pitch = 1;

            // 开始朗读
            speechSynthesis.speak(currentUtterance);

            // 更新按钮状态
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            pauseBtn.textContent = '暂停';
            pauseBtn.className = 'btn-pause';
            isPaused = false;

            // 朗读结束时重置按钮状态
            currentUtterance.onend = () => {
                startBtn.disabled = false;
                pauseBtn.disabled = true;
            };
        });

        // 暂停/继续朗读
        pauseBtn.addEventListener('click', () => {
            if (isPaused) {
                // 继续朗读
                speechSynthesis.resume();
                pauseBtn.textContent = '暂停';
                pauseBtn.className = 'btn-pause';
                isPaused = false;
            } else {
                // 暂停朗读
                speechSynthesis.pause();
                pauseBtn.textContent = '继续';
                pauseBtn.className = 'btn-resume';
                isPaused = true;
            }
        });

        // 页面关闭时停止语音
        window.addEventListener('beforeunload', () => {
            speechSynthesis.cancel();
        });
    </script>
</body>
</html>
